name: Sales promotion regression tests

on:
  pull_request:
    paths:
      - 'src/lib/sales/**'
      - 'tests/promotion-*.test.mjs'
      - '.github/workflows/sales-promotion-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute synthetic promotion tests
        run: node --test tests/promotion-*.test.mjs
